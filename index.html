<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020408">
<title>VOXAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #020408;
  --surface:  #080e14;
  --card:     #0c1520;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.12);
  --cyan:     #00e5ff;
  --cyan-dim: rgba(0,229,255,0.12);
  --amber:    #ffb347;
  --amber-dim:rgba(255,179,71,0.12);
  --rose:     #ff4d6d;
  --rose-dim: rgba(255,77,109,0.12);
  --green:    #00ff9d;
  --green-dim:rgba(0,255,157,0.08);
  --text:     #dde8f0;
  --muted:    rgba(221,232,240,0.35);
  --faint:    rgba(221,232,240,0.12);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.4;
}

/* ── AMBIENT LIGHT ── */
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: opacity 1.2s ease;
}
.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  transition: all 1.5s ease;
}
.orb-a {
  width: 500px; height: 500px;
  top: -200px; left: -150px;
  background: radial-gradient(circle, rgba(0,229,255,0.07), transparent 70%);
}
.orb-b {
  width: 400px; height: 400px;
  bottom: -150px; right: -100px;
  background: radial-gradient(circle, rgba(255,179,71,0.05), transparent 70%);
}
.orb-c {
  width: 300px; height: 300px;
  top: 40%; left: 30%;
  background: radial-gradient(circle, rgba(0,255,157,0.04), transparent 70%);
  opacity: 0;
  transition: opacity 1s ease;
}
body.s-listening .orb-c  { opacity: 1; }
body.s-thinking  .orb-a  { background: radial-gradient(circle, rgba(124,58,237,0.1), transparent 70%); }
body.s-speaking  .orb-b  { background: radial-gradient(circle, rgba(255,77,109,0.08), transparent 70%); }

/* ── SETUP SCREEN ── */
#setup {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 28px;
  background: var(--bg);
}

.setup-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 72px;
  letter-spacing: 8px;
  background: linear-gradient(135deg, var(--cyan) 0%, rgba(0,229,255,0.4) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 4px;
}

.setup-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 48px;
}

.setup-desc {
  font-size: 14px;
  color: var(--muted);
  text-align: center;
  line-height: 1.7;
  max-width: 300px;
  font-weight: 300;
  margin-bottom: 32px;
}

.field-wrap {
  width: 100%;
  max-width: 340px;
  position: relative;
  margin-bottom: 12px;
}

.field-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

.field-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  letter-spacing: 1px;
}
.field-wrap input:focus {
  border-color: rgba(0,229,255,0.4);
  box-shadow: 0 0 0 3px rgba(0,229,255,0.06);
}

.start-btn {
  width: 100%;
  max-width: 340px;
  margin-top: 20px;
  background: transparent;
  border: 1px solid rgba(0,229,255,0.3);
  border-radius: 10px;
  padding: 15px;
  color: var(--cyan);
  font-family: 'Bebas Neue', cursive;
  font-size: 22px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.start-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--cyan-dim);
  opacity: 0;
  transition: opacity 0.2s;
}
.start-btn:hover::before { opacity: 1; }
.start-btn:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,229,255,0.1); }
.start-btn:active { transform: scale(0.98); }

/* ── MAIN LAYOUT ── */
#app {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
}

/* ── HEADER ── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}

.hdr-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px;
  letter-spacing: 5px;
  background: linear-gradient(135deg, var(--cyan), rgba(0,229,255,0.5));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hdr-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.state-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 99px;
  border: 1px solid;
  transition: all 0.4s ease;
}
.state-badge.idle      { color: var(--faint); border-color: var(--border); }
.state-badge.listening { color: var(--green); border-color: rgba(0,255,157,0.3); background: var(--green-dim); }
.state-badge.thinking  { color: #a78bfa;      border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
.state-badge.speaking  { color: var(--rose);  border-color: rgba(255,77,109,0.3);  background: var(--rose-dim); }

/* ── CHAT AREA ── */
.chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 10;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { width: 0; }

/* ── MESSAGES ── */
.msg {
  display: flex;
  flex-direction: column;
  gap: 5px;
  animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.user  { align-items: flex-end; }
.msg.assistant { align-items: flex-start; }

.msg-who {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--faint);
  padding: 0 4px;
}

.msg-body {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.65;
  font-weight: 300;
}

.msg.user .msg-body {
  background: var(--card);
  border: 1px solid rgba(0,229,255,0.15);
  border-bottom-right-radius: 4px;
  color: var(--text);
  box-shadow: inset 0 1px 0 rgba(0,229,255,0.08);
}

.msg.assistant .msg-body {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

/* interim */
.interim-msg {
  align-self: flex-end;
  max-width: 82%;
  padding: 10px 16px;
  border-radius: 16px;
  border-bottom-right-radius: 4px;
  border: 1px dashed rgba(0,255,157,0.2);
  background: rgba(0,255,157,0.03);
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  font-style: italic;
  display: none;
  animation: msgIn 0.2s ease both;
}
.interim-msg.on { display: block; }

/* ── ORB AREA ── */
.orb-zone {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 28px;
  gap: 14px;
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 20;
  background: linear-gradient(to top, rgba(2,4,8,0.9), transparent);
}

/* Waveform visualiser */
.waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 24px;
}
.wv {
  width: 2.5px;
  background: var(--green);
  border-radius: 99px;
  opacity: 0.15;
  height: 4px;
  transition: opacity 0.3s;
}
body.s-listening .wv {
  opacity: 1;
  animation: wvAnim 0.8s ease-in-out infinite;
}
.wv:nth-child(1)  { animation-delay: 0.00s; }
.wv:nth-child(2)  { animation-delay: 0.07s; }
.wv:nth-child(3)  { animation-delay: 0.14s; }
.wv:nth-child(4)  { animation-delay: 0.21s; }
.wv:nth-child(5)  { animation-delay: 0.28s; }
.wv:nth-child(6)  { animation-delay: 0.35s; }
.wv:nth-child(7)  { animation-delay: 0.28s; }
.wv:nth-child(8)  { animation-delay: 0.21s; }
.wv:nth-child(9)  { animation-delay: 0.14s; }
.wv:nth-child(10) { animation-delay: 0.07s; }
.wv:nth-child(11) { animation-delay: 0.00s; }
@keyframes wvAnim {
  0%,100% { height: 3px;  }
  50%      { height: 22px; }
}
body.s-speaking .wv {
  opacity: 1;
  background: var(--rose);
  animation: wvAnim 0.4s ease-in-out infinite;
}
body.s-thinking .wv {
  opacity: 0.6;
  background: #a78bfa;
  height: 4px !important;
  animation: none;
}

/* The orb */
.orb {
  width: 72px; height: 72px;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.orb:active { transform: scale(0.93); }

.orb-bg {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border2);
  transition: all 0.4s ease;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  overflow: hidden;
}
.orb-bg::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), transparent 60%);
}

.orb-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid transparent;
  transition: all 0.4s ease;
}
.orb-ring2 {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 1px solid transparent;
  transition: all 0.4s ease;
}

body.s-standby .orb-bg {
  border-color: rgba(0,229,255,0.25);
  animation: standbyBreath 3s ease-in-out infinite;
}
body.s-standby .orb-ring { border-color: rgba(0,229,255,0.08); animation: spinRing 12s linear infinite; }
body.s-standby .orb-lbl { color: rgba(0,229,255,0.4); }
@keyframes standbyBreath {
  0%,100% { box-shadow: 0 0 8px rgba(0,229,255,0.06); opacity: 0.7; }
  50%      { box-shadow: 0 0 20px rgba(0,229,255,0.12); opacity: 1; }
}

body.s-listening .orb-bg {
  border-color: rgba(0,255,157,0.4);
  box-shadow: 0 0 0 0 rgba(0,255,157,0.2), inset 0 0 20px rgba(0,255,157,0.08);
  animation: orbGlow 2s ease-in-out infinite;
}
body.s-listening .orb-ring  { border-color: rgba(0,255,157,0.2); animation: spinRing 4s linear infinite; }
body.s-listening .orb-ring2 { border-color: rgba(0,255,157,0.08); animation: spinRing 8s linear infinite reverse; }

body.s-thinking .orb-bg {
  border-color: rgba(167,139,250,0.5);
  box-shadow: 0 0 30px rgba(167,139,250,0.15);
  animation: thinkPulse 1.2s ease-in-out infinite;
}

body.s-speaking .orb-bg {
  border-color: rgba(255,77,109,0.5);
  box-shadow: 0 0 30px rgba(255,77,109,0.15);
  animation: speakBounce 0.6s ease-in-out infinite alternate;
}
body.s-speaking .orb-ring  { border-color: rgba(255,77,109,0.2); animation: spinRing 2s linear infinite; }

@keyframes orbGlow {
  0%,100% { box-shadow: 0 0 15px rgba(0,255,157,0.15), inset 0 0 20px rgba(0,255,157,0.05); }
  50%      { box-shadow: 0 0 35px rgba(0,255,157,0.25), inset 0 0 20px rgba(0,255,157,0.1); }
}
@keyframes thinkPulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}
@keyframes speakBounce {
  from { transform: scale(1); }
  to   { transform: scale(1.07); }
}
@keyframes spinRing {
  to { transform: rotate(360deg); }
}

/* Orb label */
.orb-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--faint);
  transition: color 0.4s;
}
body.s-listening .orb-lbl { color: rgba(0,255,157,0.6); }
body.s-thinking  .orb-lbl { color: rgba(167,139,250,0.6); }
body.s-speaking  .orb-lbl { color: rgba(255,77,109,0.6); }

/* Bottom controls */
.btns {
  display: flex;
  gap: 10px;
}
.icn-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}
.icn-btn:hover { border-color: var(--border2); color: var(--text); }
.icn-btn.on { border-color: rgba(255,77,109,0.3); color: var(--rose); background: var(--rose-dim); }

/* No support */
#nosupport {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
  text-align: center;
}
#nosupport h2 { font-family: 'Bebas Neue', cursive; font-size: 32px; letter-spacing: 4px; color: var(--rose); }
#nosupport p  { font-size: 14px; color: var(--muted); font-weight: 300; line-height: 1.7; max-width: 300px; }
</style>
</head>
<body class="s-idle">

<div class="ambient">
  <div class="ambient-orb orb-a"></div>
  <div class="ambient-orb orb-b"></div>
  <div class="ambient-orb orb-c"></div>
</div>

<!-- No support -->
<div id="nosupport">
  <h2>Not Supported</h2>
  <p>Web Speech API requires Chrome on Android or desktop Chrome. Open this page in Chrome to continue.</p>
</div>

<!-- Setup -->
<div id="setup">
  <div class="setup-logo">VOXAI</div>
  <div class="setup-sub">Hands-Free Intelligence</div>
  <p class="setup-desc">Speak naturally. Pause to send. Claude responds out loud. Completely hands-free.</p>
  <div class="field-wrap">
    <span class="field-label">Anthropic API Key</span>
    <input type="password" id="keyInput" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false" />
  </div>
  <button class="start-btn" onclick="boot()">INITIALISE</button>
</div>

<!-- App -->
<div id="app" style="display:none">
  <header class="hdr">
    <div class="hdr-logo">VOXAI</div>
    <div class="hdr-right">
      <div class="state-badge idle" id="badge">IDLE</div>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="interim-msg" id="interim"></div>
  </div>

  <div class="orb-zone">
    <div class="waveform">
      <div class="wv"></div><div class="wv"></div><div class="wv"></div>
      <div class="wv"></div><div class="wv"></div><div class="wv"></div>
      <div class="wv"></div><div class="wv"></div><div class="wv"></div>
      <div class="wv"></div><div class="wv"></div>
    </div>

    <div class="orb" id="orb" onclick="toggleListen()">
      <div class="orb-ring2"></div>
      <div class="orb-ring"></div>
      <div class="orb-bg" id="orbIcon">🎙</div>
    </div>

    <div class="orb-lbl" id="orbLbl">TAP TO START</div>

    <div class="btns">
      <button class="icn-btn" id="muteBtn" onclick="toggleMute()">VOICE ON</button>
      <button class="icn-btn" onclick="clearAll()">CLEAR</button>
      <button class="icn-btn" onclick="showSetup()">KEY</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let apiKey  = localStorage.getItem('voxai-key') || '';
let history = [];
let rec     = null;
let synth   = window.speechSynthesis;
let muted   = false;
let busy    = false;   // thinking or speaking
let active  = false;   // listening
let standby = true;    // waiting for wake word "hey claude"

const chatEl    = document.getElementById('chat');
const interimEl = document.getElementById('interim');
const badge     = document.getElementById('badge');
const orbIcon   = document.getElementById('orbIcon');
const orbLbl    = document.getElementById('orbLbl');
const muteBtn   = document.getElementById('muteBtn');

// ── BOOT ──
const hasSpeech = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
if (!hasSpeech) {
  document.getElementById('nosupport').style.display = 'flex';
  document.getElementById('setup').style.display = 'none';
}

if (apiKey) {
  document.getElementById('keyInput').value = apiKey;
  launchApp();
}

function boot() {
  const k = document.getElementById('keyInput').value.trim();
  if (!k.startsWith('sk-ant-')) { alert('Enter a valid Anthropic API key (starts sk-ant-)'); return; }
  apiKey = k;
  localStorage.setItem('voxai-key', apiKey);
  launchApp();
}

function launchApp() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display   = 'flex';
  initRec();
  pushMsg('assistant', 'VOXAI on standby. Say "Hey Claude" to start.');
  speak('VOXAI on standby. Say hey Claude to start talking.');
}

function showSetup() {
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('app').style.display   = 'none';
  stop();
}

// ── SPEECH RECOGNITION ──
function initRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.continuous      = true;
  rec.interimResults  = true;
  rec.lang            = 'en-GB';
  rec.maxAlternatives = 1;

  rec.onresult = e => {
    if (busy) return;
    let fin = '', int = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (fin += t) : (int += t);
    }

    // ── STANDBY: only listen for wake word ──
    if (standby) {
      const heard = (fin + ' ' + int).toLowerCase();
      if (/\bhey\s+claude\b|\bhi\s+claude\b|\bhey\s+cloud\b/.test(heard)) {
        wake();
      }
      // show nothing in standby, just keep scanning
      return;
    }

    // ── ACTIVE: normal conversation ──
    if (int) { interimEl.textContent = int; interimEl.classList.add('on'); }
    if (fin.trim()) {
      const lower = fin.trim().toLowerCase();
      // ── SLEEP word ──
      if (/\bend conversation\b|\bgoodbye claude\b|\bstop listening\b/.test(lower)) {
        interimEl.textContent = ''; interimEl.classList.remove('on');
        sleep();
        return;
      }
      interimEl.textContent = ''; interimEl.classList.remove('on');
      send(fin.trim());
    }
  };

  rec.onend = () => { if (active && !busy) tryStart(); };
  rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') console.warn(e.error); };

  startListen();
}

function tryStart() { try { rec.start(); } catch(_){} }

// ── WAKE / SLEEP ──
function wake() {
  standby = false;
  busy = false;
  pushMsg('assistant', "I'm listening.");
  speak("Aye, I'm listening.");
}

function sleep() {
  standby = true;
  busy = false;
  active = true;
  pushMsg('assistant', 'Back on standby. Say "Hey Claude" when you need me.');
  speak('Back on standby. Say hey Claude when you need me.');
  // after speaking, speak() calls startListen() which respects standby
}

function startStandbyListen() {
  active = true;
  standby = true;
  tryStart();
  setState('standby');
}

function startListen() {
  if (busy) return;
  active = true;
  tryStart();
  setState(standby ? 'standby' : 'listening');
}

function stop() {
  active = false;
  try { rec.stop(); } catch(_){}
  setState('idle');
}

function toggleListen() {
  if (busy) { synth.cancel(); busy = false; startListen(); return; }
  if (standby) { wake(); return; }   // tap wakes from standby
  active ? stop() : startListen();
}

// ── SEND TO CLAUDE ──
async function send(text) {
  busy = true;
  active = false;
  try { rec.abort(); } catch(_){}
  setState('thinking');
  pushMsg('user', text);
  history.push({ role: 'user', content: text });

  try {
    const res  = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are VOXAI, a hands-free voice assistant. Respond conversationally and concisely — your output is spoken aloud. No markdown, no bullet points, no lists. Natural spoken sentences only. Be direct, warm, and useful. The user is Ross — a forestry contractor and software developer in Ayrshire, Scotland. He's often working outdoors or driving.`,
        messages: history
      })
    });

    const data  = await res.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content[0].text;
    history.push({ role: 'assistant', content: reply });
    pushMsg('assistant', reply);
    busy = false;
    muted ? startListen() : speak(reply);

  } catch(err) {
    busy = false;
    pushMsg('assistant', `Error: ${err.message}`);
    muted ? startListen() : speak('Something went wrong. Try again.');
  }
}

// ── TTS ──
function speak(text) {
  if (muted) { startListen(); return; }
  const clean = text
    .replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1')
    .replace(/`(.*?)`/g, '$1').replace(/#{1,6} /g, '').replace(/\n+/g, '. ');

  synth.cancel();
  setState('speaking');

  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 1.05; u.pitch = 1; u.volume = 1;

  const voices = synth.getVoices();
  const v = voices.find(v => v.name.includes('Google UK English Female'))
         || voices.find(v => v.lang === 'en-GB')
         || voices.find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;

  u.onend   = () => { startListen(); };
  u.onerror = () => { startListen(); };
  synth.speak(u);
}

// ── UI STATE ──
const STATES = {
  idle:      { cls: 'idle',      badge: 'IDLE',       lbl: 'TAP TO START',      icon: '🎙' },
  standby:   { cls: 'idle',      badge: 'STANDBY',    lbl: 'SAY "HEY CLAUDE"',  icon: '🌙' },
  listening: { cls: 'listening', badge: 'LISTENING',  lbl: 'LISTENING',         icon: '🎙' },
  thinking:  { cls: 'thinking',  badge: 'THINKING',   lbl: 'THINKING',          icon: '◌'  },
  speaking:  { cls: 'speaking',  badge: 'SPEAKING',   lbl: 'SPEAKING',          icon: '◉'  },
};

function setState(s) {
  document.body.className = `s-${s === 'standby' ? 'standby' : s}`;
  const cfg = STATES[s];
  badge.className  = `state-badge ${cfg.cls}`;
  badge.textContent = cfg.badge;
  orbLbl.textContent = cfg.lbl;
  orbIcon.textContent = cfg.icon;
}

// ── MESSAGES ──
function pushMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-who">${role === 'user' ? 'YOU' : 'VOXAI'}</div>
    <div class="msg-body">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
  chatEl.insertBefore(div, interimEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function clearAll() {
  history = [];
  chatEl.querySelectorAll('.msg').forEach(m => m.remove());
}

function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? 'VOICE OFF' : 'VOICE ON';
  muteBtn.classList.toggle('on', muted);
  if (muted) synth.cancel();
}
</script>
